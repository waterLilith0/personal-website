name: Frontend

on:
  pull_request:
  # So the deploy workflow can run the same checks before it ships anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The same major as the Dockerfile's build stage.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs tsc -b, then vite build
      - name: Build
        run: npm run build
