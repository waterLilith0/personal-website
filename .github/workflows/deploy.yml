name: CI/CD Pipeline

on:
  push:
    branches: [staging, main]

permissions:
  contents: read

# One deploy per branch at a time, so two quick pushes can't race to push the
# same image tag. A running deploy is never cancelled, the next one waits.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- CHECK THE FRONTEND BEFORE ANYTHING IS SHIPPED ---
  frontend-checks:
    uses: ./.github/workflows/frontend.yml

  # --- BUILD AND PUSH THE WEBSITE IMAGE ---
  build-image:
    needs: frontend-checks
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'master' || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image name
        id: image-name
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        # Image names must be lowercase and free of whitespace, which a pasted secret may not be.
        # The value is never printed, only what is wrong with it.
        run: |
          owner="$(printf '%s' "$DOCKER_USERNAME" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$owner" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::DOCKER_USERNAME is not a plain Docker Hub username (length ${#owner}, contains '@': $([[ "$owner" == *@* ]] && echo yes || echo no), contains '/': $([[ "$owner" == */* ]] && echo yes || echo no)). Set it to the username only, not an email or a repository path."
            exit 1
          fi
          echo "website_image=${owner}/personal-website" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Website
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # Baked into the static bundle and visible to every visitor, so none of these are secrets.
          build-args: |
            VITE_FARO_ENABLED=true
            VITE_FARO_URL=https://faro-collector-prod-eu-west-2.grafana.net/collect/f974a455dacacf8f62e85e96567d7ff6
            VITE_APP_ENV=${{ github.ref_name == 'main' && 'prod' || 'staging' }}
            VITE_DASHBOARD_URL=${{ vars.VITE_DASHBOARD_URL }}
            FARO_UPLOAD_ENDPOINT=${{ vars.FARO_UPLOAD_ENDPOINT }}
            FARO_APP_ID=8206
            FARO_STACK_ID=1602980
            FARO_GIT_HASH=${{ github.sha }}
          # Mounted only for the build step, so it never ends up in an image layer.
          secrets: |
            faro_api_key=${{ secrets.FARO_API_KEY }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image-name.outputs.website_image }}:${{ github.ref_name == 'main' && 'prod' || 'staging' }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
