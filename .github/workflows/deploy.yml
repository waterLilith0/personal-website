name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

# One deploy per branch at a time, so two quick pushes can't race to push the
# same image tag. A running deploy is never cancelled, the next one waits.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- CHECK THE FRONTEND BEFORE ANYTHING IS SHIPPED ---
  frontend-checks:
    uses: ./.github/workflows/frontend.yml

  # --- BUILD AND PUSH THE WEBSITE IMAGE ---
  build-image:
    needs: frontend-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image name
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        # Image names must be lowercase and free of whitespace, which a pasted secret may not be.
        # The value is never printed, only what is wrong with it.
        run: |
          owner="$(printf '%s' "$DOCKER_USERNAME" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$owner" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::DOCKER_USERNAME is not a plain Docker Hub username (length ${#owner}, contains '@': $([[ "$owner" == *@* ]] && echo yes || echo no), contains '/': $([[ "$owner" == */* ]] && echo yes || echo no)). Set it to the username only, not an email or a repository path."
            exit 1
          fi
          echo "WEBSITE_IMAGE=${owner}/personal-website" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Website
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Baked into the static bundle and visible to every visitor, so none of these are secrets.
          build-args: |
            VITE_FARO_ENABLED=true
            VITE_FARO_URL=https://faro-collector-prod-eu-west-2.grafana.net/collect/f974a455dacacf8f62e85e96567d7ff6
            VITE_APP_ENV=${{ github.ref_name == 'main' && 'production' || github.ref_name }}
            FARO_UPLOAD_ENDPOINT=${{ vars.FARO_UPLOAD_ENDPOINT }}
            FARO_APP_ID=${{ vars.FARO_APP_ID }}
            FARO_STACK_ID=${{ vars.FARO_STACK_ID }}
            FARO_GIT_HASH=${{ github.sha }}
          # Mounted only for the build step, so it never ends up in an image layer.
          secrets: |
            faro_api_key=${{ secrets.FARO_API_KEY }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.WEBSITE_IMAGE }}:${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
