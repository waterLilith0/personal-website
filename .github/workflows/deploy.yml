name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

# One deploy per branch at a time, so two quick pushes can't race to push the
# same image tag. A running deploy is never cancelled, the next one waits.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  WEBSITE_IMAGE: ${{ secrets.DOCKER_USERNAME }}/personal-website

jobs:
  # --- CHECK THE FRONTEND BEFORE ANYTHING IS SHIPPED ---
  frontend-checks:
    uses: ./.github/workflows/frontend.yml

  # --- BUILD AND PUSH THE WEBSITE IMAGE ---
  build-image:
    needs: frontend-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Website
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Baked into the static bundle and visible to every visitor, so none of these are secrets.
          build-args: |
            VITE_FARO_ENABLED=true
            VITE_FARO_URL=https://faro.waterlilith.space/collect
            FARO_UPLOAD_ENDPOINT=${{ vars.FARO_UPLOAD_ENDPOINT }}
            FARO_APP_ID=${{ vars.FARO_APP_ID }}
            FARO_STACK_ID=${{ vars.FARO_STACK_ID }}
          # Mounted only for the build step, so it never ends up in an image layer.
          secrets: |
            faro_api_key=${{ secrets.FARO_API_KEY }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.WEBSITE_IMAGE }}:${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
