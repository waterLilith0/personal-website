version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Keep Node types aligned with the approved Node LTS major.
      - dependency-name: "@types/node"
        versions:
          - ">=27.0.0"
    groups:
      npm-production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # Review and update this restriction when moving to the next Node LTS.
      - dependency-name: node
        versions:
          - ">= 27"
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch
