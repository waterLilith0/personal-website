server {
    listen 80;

    # Standard Nginx MIME type definitions
    include /etc/nginx/mime.types;

    # 1. Never cache index.html (solves Cloudflare serving old hash references)
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 2. Gallery images from the internal gallery stack (network hz_gallery).
    #    Resolved per request so the site still starts when the gallery is down.
    location /media/ {
        resolver 127.0.0.11 valid=30s;
        set $gallery http://gallery:80;
        proxy_pass $gallery;
    }

    # 3. Main SPA fallback (your original configuration preserved)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}